[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"


[project]


name = "{{ cookiecutter.project_name }}"
description = "..."
authors=[{name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}"}]
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"

dynamic = ["dependencies", "version"]

classifiers=[
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]


# [project.urls]
# Homepage = "..."

[project.scripts]
{{ cookiecutter.project_name }} = "{{ cookiecutter.project_name }}.cli:main"

[tool.setuptools.packages.find]
# note: `include-package-data = true` by default in pyproject.toml
where = ["src"]

# siginificantly speed up pytest
[tool.pytest.ini_options]
testpaths = [ "tests"]

# see https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html#attr
[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
version = {attr = "{{ cookiecutter.project_name }}.__version__"}
